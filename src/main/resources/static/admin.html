<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>HOMEDRIVE Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="scene" aria-hidden="true">
        <div class="scene-plane plane-a"></div>
        <div class="scene-plane plane-b"></div>
        <div class="scene-grid"></div>
        <div class="scene-sheen"></div>
    </div>

    <main class="app-shell admin-shell">
        <section id="admin-auth-screen" class="auth-screen screen-active" aria-label="Admin authentication">
            <div class="auth-wrap">
                <div class="brand auth-brand">
                    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>HOMEDRIVE ADMIN</span>
                </div>

                <form id="admin-login-form" class="glass-panel auth-panel auth-form active" novalidate>
                    <div class="panel-light" aria-hidden="true"></div>
                    <div class="form-copy">
                        <p class="overline">ADMIN ACCESS</p>
                        <h1>Admin</h1>
                    </div>

                    <label for="admin-username">Username</label>
                    <div class="field">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.4 8.5 8 9 4.6-.5 8-4 8-9V6Z"></path><path d="M9.5 12.5 11 14l3.5-4"></path></svg>
                        <input id="admin-username" name="username" type="text" autocomplete="username" placeholder="nathan" required>
                    </div>

                    <label for="admin-password">Password</label>
                    <div class="field">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
                        <input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="password" required>
                        <button class="icon-button password-toggle" type="button" aria-label="Show password">
                            <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.5 5.4A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-3 4"></path><path d="M6.6 6.6C3.7 8.6 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.4-.9"></path></svg>
                        </button>
                    </div>

                    <button class="primary-button" type="submit">Sign in</button>
                    <p class="form-message" aria-live="polite"></p>
                    <a class="admin-auth-link" href="/">Back to drive</a>
                </form>
            </div>
        </section>

        <section id="admin-dashboard-screen" class="dashboard-screen admin-dashboard-screen" hidden>
            <aside class="glass-panel sidebar" aria-label="Admin navigation">
                <div class="panel-light" aria-hidden="true"></div>
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span>ADMIN</span>
                </div>

                <nav class="nav-list admin-nav-list">
                    <button class="nav-button active" type="button" data-admin-view="users">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21a5 5 0 0 0-10 0"></path><circle cx="12" cy="8" r="4"></circle><path d="M22 21a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg>
                        <span>Users</span>
                    </button>
                    <button class="nav-button" type="button" data-admin-view="system">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="M8 22h8"></path><path d="M12 18v4"></path></svg>
                        <span>System</span>
                    </button>
                </nav>

                <div class="sidebar-footer">
                    <p id="admin-sidebar-user">admin</p>
                    <button id="admin-open-app" class="ghost-button" type="button">Drive</button>
                    <button id="admin-logout-button" class="ghost-button" type="button">Sign out</button>
                </div>
            </aside>

            <section class="workspace admin-workspace">
                <section id="admin-users-view" class="view active" aria-labelledby="admin-users-title">
                    <header class="view-header">
                        <div>
                            <p class="overline">ADMIN</p>
                            <h2 id="admin-users-title">Users</h2>
                        </div>
                        <button id="admin-refresh-users" class="icon-text-button" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v6h-6"></path></svg>
                            <span>Refresh</span>
                        </button>
                    </header>

                    <div class="stats-grid admin-stats-grid">
                        <article class="glass-panel stat-card">
                            <div class="panel-light" aria-hidden="true"></div>
                            <p>Total users</p>
                            <strong id="admin-stat-users">0</strong>
                        </article>
                        <article class="glass-panel stat-card">
                            <div class="panel-light" aria-hidden="true"></div>
                            <p>Admins</p>
                            <strong id="admin-stat-admins">0</strong>
                        </article>
                        <article class="glass-panel stat-card">
                            <div class="panel-light" aria-hidden="true"></div>
                            <p>Storage</p>
                            <strong id="admin-stat-storage">0 B</strong>
                        </article>
                    </div>

                    <section class="glass-panel admin-table-panel" aria-label="Registered users">
                        <div class="panel-light" aria-hidden="true"></div>
                        <div class="admin-panel-head">
                            <div>
                                <p class="overline">SIGNUPS</p>
                                <strong>Registered users</strong>
                            </div>
                            <p id="admin-users-message" class="status-text" aria-live="polite"></p>
                        </div>
                        <div class="admin-user-table">
                            <div class="admin-user-row admin-user-row-head">
                                <span>User</span>
                                <span>Joined</span>
                                <span>Storage</span>
                                <span>Role</span>
                                <span>Action</span>
                            </div>
                            <div id="admin-user-list"></div>
                        </div>
                    </section>
                </section>

                <section id="admin-system-view" class="view" aria-labelledby="admin-system-title">
                    <header class="view-header">
                        <div>
                            <p class="overline">CONTROL</p>
                            <h2 id="admin-system-title">System</h2>
                        </div>
                        <button id="admin-refresh-system" class="icon-text-button" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v6h-6"></path></svg>
                            <span>Refresh</span>
                        </button>
                    </header>

                    <div class="stats-grid admin-stats-grid">
                        <article class="glass-panel stat-card">
                            <div class="panel-light" aria-hidden="true"></div>
                            <p>Files</p>
                            <strong id="admin-stat-files">0</strong>
                        </article>
                        <article class="glass-panel stat-card">
                            <div class="panel-light" aria-hidden="true"></div>
                            <p>Folders</p>
                            <strong id="admin-stat-folders">0</strong>
                        </article>
                        <article class="glass-panel stat-card">
                            <div class="panel-light" aria-hidden="true"></div>
                            <p>Uploads</p>
                            <strong id="admin-stat-uploads">0</strong>
                        </article>
                    </div>

                    <section class="glass-panel admin-system-panel" aria-label="System controls">
                        <div class="panel-light" aria-hidden="true"></div>
                        <div>
                            <p class="overline">MAINTENANCE</p>
                            <h3>Upload sessions</h3>
                            <p id="admin-system-message" class="muted-line" aria-live="polite">Ready</p>
                        </div>
                        <button id="admin-clear-uploads" class="secondary-button compact danger-button" type="button">Clear uploads</button>
                    </section>
                </section>
            </section>
        </section>
    </main>

    <script src="/admin.js" defer></script>
</body>
</html>
