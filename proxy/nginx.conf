resolver 127.0.0.11 valid=10s ipv6=off;

upstream homedrive_spring {
    zone homedrive_spring 64k;
    server homedrive-spring-primary:8080 resolve;
    server homedrive-spring-secondary:8080 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10G;

    location / {
        proxy_pass http://homedrive_spring;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Homedrive-Upstream $upstream_addr always;
    }
}
